name: Temporary Coread chapter validation
on:
  push:
    branches: [feat/cc-append-chapter-20261022]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/cc-append-chapter.test.mjs
      - run: npm test
